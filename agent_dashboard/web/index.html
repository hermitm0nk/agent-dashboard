<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Dashboard</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <main>
    <header><h1>Agent Dashboard</h1><span id="connection">Connecting…</span></header>
    <nav><button id="agents-nav">Agents</button><button id="rules-nav">Notification rules</button></nav>
    <div id="agents-screen"><section class="toolbar"><label>Filter <input id="filter" placeholder="agent, host, status"></label></section>
    <section><table><thead><tr><th>Agent</th><th>Status</th><th>Harness</th><th>Host</th><th>Activity</th><th>Location</th><th>Focus</th></tr></thead>
      <tbody id="agents"><tr><td colspan="7">Loading…</td></tr></tbody></table></section>
    </div><section class="rules" id="rules-screen" hidden><h2>Notification rules</h2><p>Configure the complete rule editor in the built Web UI.</p><ul id="rules"></ul></section>
  </main>
  <script src="/web/app.js"></script>
</body>
</html>
