[build-system]
requires = ["setuptools>=68"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "agent-dashboard"
version = "0.1.0"
description = "A command center for asynchronous coding agents"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "textual>=0.80,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
agent-dashboard = "agent_dashboard.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent_dashboard*"]

[tool.setuptools.package-data]
agent_dashboard = [
  "web/*",
  "web_dist/*",
  "web_dist/assets/*",
]
